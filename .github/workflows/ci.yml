name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

env:
  CARGO_TERM_COLOR: always

jobs:
  engine:
    name: Moteur
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The engine drives ffmpeg as a subprocess; the build only needs the
      # binaries present, not the development headers.
      - name: Installer ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Analyse statique
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all

      - name: Compilation
        run: cargo build --release
